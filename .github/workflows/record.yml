# Daily, an hour after Tracker's checkpoint cron (03:15 UTC): verify what is
# recorded, fetch the latest signed checkpoints, and commit each new one on its
# own. Uses only the workflow's GITHUB_TOKEN; no secrets.
name: record checkpoints

on:
  schedule:
    - cron: "15 4 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: record-checkpoints
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Verify the recorded checkpoints
        run: node verify.mjs
      - name: Record new checkpoints
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: node update.mjs
      # Push whatever was recorded even when update.mjs refused something, so a
      # bad checkpoint for one project does not hide good ones for others.
      - name: Push
        if: ${{ !cancelled() }}
        run: git push origin HEAD:main
